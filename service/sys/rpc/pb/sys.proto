syntax = "proto3";

package sys;
option go_package = "./sys";

// ========== 公共结构 ==========

message Empty {}

message CommonResp {
  int64 code = 1;
  string msg = 2;
}

// ========== 认证 ==========

message LoginReq {
  string username = 1;
  string password = 2;
  string client_ip = 3;
  string user_agent = 4;
}

message LoginResp {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  UserInfo user_info = 4;
}

message UserInfo {
  int64 user_id = 1;
  string username = 2;
  string nickname = 3;
  string email = 4;
  string phone = 5;
  string avatar = 6;
  repeated string roles = 7;
  repeated MenuItem menus = 8;
}

message MenuItem {
  int64 id = 1;
  int64 parent_id = 2;
  string menu_name = 3;
  int64 menu_type = 4;
  string path = 5;
  string component = 6;
  string icon = 7;
  int64 sort = 8;
  string perms = 9;
  int64 status = 10;
  repeated MenuItem children = 11;
}

// ========== 权限 ==========

message CheckPermissionReq {
  int64 user_id = 1;
  string path = 2;
  string method = 3;
}

message CheckPermissionResp {
  bool allowed = 1;
}

// ========== 服务定义 ==========
service Auth {
  rpc Login (LoginReq) returns (LoginResp);
}

service Permission {
  rpc CheckPermission (CheckPermissionReq) returns (CheckPermissionResp);
}
