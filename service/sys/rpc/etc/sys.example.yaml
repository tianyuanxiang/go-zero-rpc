Name: sys.rpc
ListenOn: 0.0.0.0:9100
Mode: dev

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: sys.rpc

JwtAuth:
  AccessSecret: "replace-with-your-access-secret"
  AccessExpire: 1200
  RefreshExpire: 10080

DB:
  DataSource: "postgres://user:password@127.0.0.1:5432/database?sslmode=disable&TimeZone=Asia/Shanghai"

CacheRedis:
  - Host: "127.0.0.1:6379"
    Pass: ""
    Type: node

BizRedis:
  Host: 127.0.0.1:6379
  Pass: ""
  DB: 10

CasbinModelPath: "etc/rbac_model.conf"
UploadPath: "uploads"

Log:
  Mode: console
  Level: debug
  Encoding: plain
  WithCaller: true
